apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: contour-db
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-202609281634-system-bookworm@sha256:dc7fa2b7418ac5a3c0b25514f70fcdce52b16c3b0eacfc9dd006143adfb0f7c0
  enableSuperuserAccess: false
  storage:
    size: 20Gi
  bootstrap:
    initdb:
      database: contour
      owner: contour
      secret:
        name: contour-db-credentials
  managed:
    roles:
      - name: contour
        ensure: present
        login: true
        passwordSecret:
          name: contour-db-credentials
  postgresql:
    pg_hba:
      - hostnossl all all all reject
      - hostssl all all all scram-sha-256
    parameters:
      max_connections: "200"
      shared_buffers: 256MB
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
