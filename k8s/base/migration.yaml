apiVersion: batch/v1
kind: Job
metadata:
  name: contour-migrate
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: contour
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      serviceAccountName: contour
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: contour-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: registry.carverauto.dev/contour/contour:build-required
          command: [/app/bin/contour, eval, Contour.Release.migrate()]
          envFrom:
            - configMapRef:
                name: contour-config
          env:
            - name: CONTOUR_ROLE
              value: migrate
            - name: CLUSTER_ENABLED
              value: "false"
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: contour-db-credentials
                  key: username
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: contour-db-credentials
                  key: password
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: db-ca
              mountPath: /etc/contour/db-ca
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: db-ca
          secret:
            secretName: contour-db-ca
