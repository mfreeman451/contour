apiVersion: apps/v1
kind: Deployment
metadata:
  name: contour-core
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 3
  revisionHistoryLimit: 3
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: contour
      app.kubernetes.io/component: core
  template:
    metadata:
      labels:
        app.kubernetes.io/name: contour
        app.kubernetes.io/component: core
    spec:
      serviceAccountName: contour
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      imagePullSecrets:
        - name: contour-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: contour
              app.kubernetes.io/component: core
      containers:
        - name: contour
          image: registry.carverauto.dev/contour/contour:build-required
          envFrom:
            - configMapRef:
                name: contour-config
            - secretRef:
                name: contour-cluster-secret
          env:
            - name: CONTOUR_ROLE
              value: core
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: contour-db-credentials
                  key: username
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: contour-db-credentials
                  key: password
          ports:
            - name: health
              containerPort: 4001
            - name: epmd
              containerPort: 4369
            - name: distribution
              containerPort: 9100
          startupProbe:
            httpGet:
              path: /health/live
              port: 4001
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 4001
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health/live
              port: 4001
            periodSeconds: 10
          resources:
            requests:
              cpu: 1000m
              memory: 1Gi
            limits:
              memory: 2Gi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: distribution-tls
              mountPath: /etc/contour/distribution
              readOnly: true
            - name: distribution-options
              mountPath: /etc/contour/distribution-options
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: db-ca
              mountPath: /etc/contour/db-ca
              readOnly: true
      volumes:
        - name: distribution-tls
          secret:
            secretName: contour-distribution-tls
            defaultMode: 0440
        - name: distribution-options
          configMap:
            name: contour-distribution-options
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: db-ca
          secret:
            secretName: contour-db-ca
