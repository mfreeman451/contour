apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: contour-https
spec:
  parentRefs:
    - name: farm01-gateway
      namespace: farm01-edge
      sectionName: https
  hostnames: [contour.k8s-farm.carverauto.dev]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /health
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /login
            statusCode: 302
    - backendRefs:
        - name: contour-web
          port: 4000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: contour-http-redirect
spec:
  parentRefs:
    - name: farm01-gateway
      namespace: farm01-edge
      sectionName: http
  hostnames: [contour.k8s-farm.carverauto.dev]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
